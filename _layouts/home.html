<html>

{% include head.html %}

<style>
/* ── Banner background slideshow ─────────────────────────────────────── */
#banner { position: relative; overflow: hidden; }

.banner-slide {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: bgFade 48s infinite;
    z-index: 0;
}
.banner-slide:nth-child(1) { animation-delay:  0s; }
.banner-slide:nth-child(2) { animation-delay:  8s; }
.banner-slide:nth-child(3) { animation-delay: 16s; }
.banner-slide:nth-child(4) { animation-delay: 24s; }
.banner-slide:nth-child(5) { animation-delay: 32s; }
.banner-slide:nth-child(6) { animation-delay: 40s; }

@keyframes bgFade {
    0%     { opacity: 0; }
    2.08%  { opacity: 1; }   /* 1s fade in  */
    16.67% { opacity: 1; }   /* hold until 8s */
    18.75% { opacity: 0; }   /* 1s fade out */
    100%   { opacity: 0; }
}

/* Dark overlay for text legibility */
.banner-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1;
}

#banner .inner { position: relative; z-index: 2; }
</style>

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">

        <!-- Background slideshow -->
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/kateryna-melnyk-6XZZns74XGc-unsplash.jpg" | relative_url }}');"></div>
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/kateryna-melnyk-XVWTWV9FOZs-unsplash.jpg" | relative_url }}');"></div>
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/damian-karpinski-29CoR39HiMo-unsplash.jpg" | relative_url }}');"></div>
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/damian-karpinski-hfPcaJQQtuY-unsplash.jpg" | relative_url }}');"></div>
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/dawid-labno-VbK9wD-hzqI-unsplash.jpg" | relative_url }}');"></div>
        <div class="banner-slide" style="background-image: url('{{ "/pics/background/damian-karpinski-316FEzAp6Pg-unsplash.jpg" | relative_url }}');"></div>

        <!-- Dark overlay -->
        <div class="banner-overlay"></div>

        <div class="inner">
            <header class="major">
                <h1>{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ site.description }}</p>
                <ul class="actions">
                    <li><a href="/about/" class="button next">Meet the Team</a></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Main -->
    <div id="main">

        <!-- One -->
        {% include tiles.html %}

        <!-- Two -->
        <section id="two">
            <div class="inner">
                <p>{{ content }}</p>
                <ul class="actions">
                    <li><a href="/about/" class="button next">Meet the Team</a></li>
                </ul>
            </div>
        </section>

    </div>

    {% include footer.html %}

</body>

</html>
