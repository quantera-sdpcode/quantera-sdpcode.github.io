<html>

{% include head.html %}

<style>
/* ── Banner background ───────────────────────────────────────────────── */
#banner {
    position: relative;
    overflow: hidden;
    background-image: url('/pics/background/damian-karpinski-316FEzAp6Pg-unsplash.jpg');
    background-size: cover;
    background-position: center;
}

/* Dark overlay for text legibility */
.banner-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.45);
    z-index: 1;
    transition: background 0.4s ease;
}
#banner:hover .banner-overlay {
    background: rgba(0, 0, 0, 0.05);
}

#banner .inner { position: relative; z-index: 2; }
</style>

<body>

    {% include header.html %}

    <!-- Banner -->
    <section id="banner" class="major">

        <!-- Dark overlay -->
        <div class="banner-overlay"></div>

        <div class="inner">
            <header class="major">
                <h1>{{ page.landing-title }}</h1>
            </header>
            <div class="content">
                <p style="text-transform: uppercase;">{{ site.description }}</p>
                <ul class="actions">
                    <li><a href="/about/" class="button next">Meet the Team</a></li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Main -->
    <div id="main">

        <!-- One -->
        {% include tiles.html %}

        <!-- Two -->
        <section id="two">
            <div class="inner">
                <p>{{ content }}</p>
                <ul class="actions">
                    <li><a href="/about/" class="button next">Meet the Team</a></li>
                </ul>
            </div>
        </section>

    </div>

    {% include footer.html %}

</body>

</html>
